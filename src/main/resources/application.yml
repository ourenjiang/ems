app:
  name: "My Application"
  version: 1.0.0

database:
  url: "jdbc:mysql://localhost:3306/mydb"
  username: admin
  password: secret
  pool-size: 10

features:
  enabled: true
  options:
    - "AUTH_ENABLED"
    - "LOGGING"

## 空调设备组
air: {
  devices: [
    {
      enable: true,
      type: Custom,
      modbus-proxy: 192.168.10.1:1507,
      modbus-addr: 1,
    },
  ]
}